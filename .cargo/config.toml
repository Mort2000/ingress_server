# P4-BUILD: every build of this repository resolves the audited
# closure from the committed vendor/ directory (D72). Generated by
# `cargo vendor --versioned-dirs vendor`; kept byte-identical to the
# configuration cargo prints. The offline proof
# (scripts/offline-build-proof.sh) runs `cargo build --release
# --locked --offline` with a FRESH CARGO_HOME and target dir.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
