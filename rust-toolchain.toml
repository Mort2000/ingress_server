# P4-BUILD: the frozen toolchain of the audited build closure
# (D71; pin kept under D94). The rustup proxy at /usr/bin/cargo honors this file, so every
# cargo command in this repository resolves 1.98.0. Provisioning is
# the one out-of-band step (rustup network): see docs/design/build-provenance.md.
[toolchain]
channel = "1.98.0"
components = ["rustfmt"]
