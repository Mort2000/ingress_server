[package]
name = "arena-client-sdk"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
arena-core = { path = "../arena-core" }
arena-protocol = { path = "../arena-protocol" }
planus = "1.3"
arena-replay = { path = "../arena-replay", optional = true }
blake3 = { version = "1.8.7", optional = true }

[features]
offline = ["dep:arena-replay", "dep:blake3"]

[dev-dependencies]
arena-server = { path = "../arena-server" }
