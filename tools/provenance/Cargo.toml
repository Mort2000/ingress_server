[package]
name = "provenance"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"

[dev-dependencies]
# Same version as the regular dependency: no new closure entry.
blake3 = "1.8"

# Provenance tooling is operator-side (P4-BUILD): it hashes the audited
# tree, lockfile, toolchain identity, and build products so every match
# binary is traceable to the exact audited inputs (ADR-0005). blake3 is
# the sanctioned dependency (ADR-0013); everything else is std.
