<title>Ingress Arena Replay Viewer</title>
<style>
/* Ingress Arena replay viewer — self-contained stylesheet (no external
   requests; the page opens from file://). Dark theme: portals read best on
   a dark map background. */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #101418;
  color: #d7dce2;
  font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
}
h2 {
  margin: 0 0 6px 0;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #8a97a8;
}
#hdr {
  padding: 10px 16px;
  border-bottom: 1px solid #2a323c;
  background: #151b22;
}
#hdr .title { font-size: 16px; font-weight: 600; color: #eef2f6; }
#hdr .grid {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 28px;
  margin-top: 6px;
  font-size: 12.5px;
  color: #aab6c4;
}
#hdr .grid b { color: #d7dce2; font-weight: 600; }
#hdr .hash { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
#hdr .banner {
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 12.5px;
}
#hdr .banner.abnormal { background: #3a1f24; color: #f0b7bf; border: 1px solid #7c3a44; }
#hdr .banner.dev { background: #3a331b; color: #eadfae; border: 1px solid #8a7c37; }
#hdr .banner.rvis { background: #1c2f2a; color: #a9d8cb; border: 1px solid #37695c; }
#layout {
  display: flex;
  gap: 14px;
  padding: 12px 16px;
  align-items: flex-start;
  flex-wrap: wrap;
}
#stage { flex: 0 0 auto; }
#map {
  background: #0b0e12;
  border: 1px solid #2a323c;
  border-radius: 6px;
  display: block;
}
#controls { margin-top: 8px; max-width: 920px; }
#controls-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
button, select {
  background: #1c242e;
  color: #d7dce2;
  border: 1px solid #37424f;
  border-radius: 4px;
  padding: 5px 10px;
  font: inherit;
  cursor: pointer;
}
button:hover:not(:disabled), select:hover { background: #243040; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
#speed-label { font-size: 12.5px; color: #8a97a8; display: inline-flex; align-items: center; gap: 6px; }
#round-readout {
  font-family: ui-monospace, Consolas, monospace;
  font-size: 13px;
  color: #eef2f6;
  margin-left: auto;
}
#slider-wrap { position: relative; margin-top: 8px; height: 30px; }
#slider { width: 100%; padding: 0; }
#ticks { position: absolute; left: 0; right: 0; top: -4px; height: 6px; pointer-events: none; }
#ticks .tick {
  position: absolute;
  top: 0;
  width: 2px;
  height: 6px;
  background: #e8b64c;
}
#views { margin-top: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#views button.active { background: #2c4a42; border-color: #1fb79b; color: #7ce8cf; }
#view-note { font-size: 12px; color: #8a97a8; }
#side { flex: 1 1 380px; min-width: 360px; }
#score-panel, #event-panel {
  background: #151b22;
  border: 1px solid #2a323c;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 14px;
}
#curve { display: block; background: #0b0e12; border: 1px solid #2a323c; border-radius: 4px; }
#score-readout { margin-top: 8px; font-size: 12.5px; }
#score-readout .row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
#score-readout .enl { color: #4fd4b8; }
#score-readout .res { color: #6fabff; }
#score-readout .num { font-family: ui-monospace, Consolas, monospace; }
#score-readout .delta { color: #8a97a8; }
#event-filters { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: #aab6c4; margin-bottom: 6px; }
#event-filters label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
#event-filters .group { border-left: 1px solid #2a323c; padding-left: 12px; }
#events {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 340px;
  overflow-y: auto;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 12px;
}
#events li {
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
}
#events li.current { background: #2c4a42; }
#events li .enl { color: #4fd4b8; }
#events li .res { color: #6fabff; }
#events li .both { color: #d9c98a; }
#events li .dim { color: #77828f; }
#selftest-result { padding: 12px 16px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
#selftest-result:empty { display: none; }
#selftest-result .pass { color: #4fd4b8; }
#selftest-result .fail { color: #ff8a93; }
#selftest-result table { border-collapse: collapse; margin-top: 8px; }
#selftest-result td { padding: 2px 14px 2px 0; vertical-align: top; }
#selftest-result .why { color: #ffcf6f; }

</style>
</head>

    <section id="score-panel">

    <section id="event-panel">
      <h2>Events</h2>
      <div id="event-filters"></div>
      <ol id="events"></ol>
    </section>
  </aside>
</main>

<script>
"use strict";
// data.js — data layer. The exporter embedded `const VIEWER_DATA = {...}`
// in its own script block above this one; everything here reads that
// constant and hands out normalized round state. Embedded DATA stays
// integer: score2/delta2/final_score2 are decimal STRINGS (u128-exact,
// D91) and are converted with BigInt only at the display boundary.
// Jumping is O(1): rounds[i-1] is the FULLY materialized post-round state
// (D89) — checkpoints are display ticks, not seek machinery.
const D = {
  data: VIEWER_DATA,

  get header() { return this.data.header; },
  get rounds() { return this.data.rounds; },
  get roundCount() { return this.data.rounds.length; },

  // Map id -> [x, y] for the static portal positions (cm integers).
  portalPos: null,

  init() {
    this.portalPos = new Map(
      this.data.header.map.portals.map((p) => [p[0], [p[1], p[2]]])
    );
  },

  // Normalized state at round i (i in 0..N). Round 0 is the pre-match
  // moment: the frozen neutral map plus spawn dots (derived here, not
  // embedded — D89 note).
  stateAt(i) {
    if (i === 0) {
      return {
        r: 0,
        portals: this.data.header.map.portals.map((p) => [p[0], 0, 0]),
        links: [],
        fields: [],
        events: [],
        score2: ["0", "0"],
        delta2: ["0", "0"],
        hash: null,
      };
    }
    return this.rounds[i - 1];
  },

  // Cumulative score2 at round i as BigInts (exact).
  score2At(i) {
    const s = this.stateAt(i).score2;
    return [BigInt(s[0]), BigInt(s[1])];
  },

  // The events of rounds 1..i, flattened (round 0 has none).
  eventsThrough(i) {
    const out = [];
    for (let r = 1; r <= i; r += 1) {
      for (const ev of this.rounds[r - 1].events) out.push(ev);
    }
    return out;
  },
};

// filter.js — THE view predicate (single source of truth inside the page).
//
//   God View     = public state + every EMBEDDED faction's agents
//   Faction F    = public state + agents[F]            (and nothing else)
//   Public View  = public state only — no agents at all
//
// Mirrored by the Rust twins in tools/replay-export/src/views.rs and
// asserted in-page by ?selftest=1 (checklist item 7, P6-GATE(c)). R-VIS:
// agent positions/supply are PRIVATE — a faction view never draws enemy
// agents; in a --dev 0 export the enemy's data is not even in the file
// (D90 construction guarantee), and in a --dev 1 export this predicate
// still selects only the view's own faction.
const Filter = {
  embedded: [], // e.g. ["enl"] or ["enl", "res"]

  init() {
    this.embedded = D.data.header.factions_embedded.slice();
  },

  // Which factions' agent arrays a view may read.
  visibleFactions(view) {
    if (view === "public") return [];
    if (view === "god") return this.embedded.slice();
    return this.embedded.includes(view) ? [view] : [];
  },

  // The agents `view` shows at round i (0..N). Round 0 derives the
  // pre-match spawn dots from header.spawns for the same factions.
  visibleAgents(view, i) {
    const out = [];
    for (const key of this.visibleFactions(view)) {
      if (i === 0) {
        const rows = D.data.header.spawns[key] || [];
        for (const row of rows) {
          out.push({ faction: key, id: row[0], x: row[1], y: row[2], supply: -1 });
        }
      } else {
        const rows = (D.data.agents[key] || [])[i - 1] || [];
        for (const row of rows) {
          out.push({ faction: key, id: row[0], x: row[1], y: row[2], supply: row[3] });
        }
      }
    }
    return out;
  },

  // Event-log predicate: kind checked AND faction checked. REINFORCEMENT
  // (k=8) carries no faction (it is both-faction), so it is visible under
  // any faction filter as long as its kind is checked.
  eventVisible(ev, kinds, factions) {
    return kinds.has(ev.k) && (ev.f === undefined || factions.has(ev.f));
  },
};

// render.js — the map canvas (display layer: floats are fine here; the
// data feeding it stays integer). One canvas; cm -> px transform fits the
// frozen map into the element with a margin and a flipped y axis.
const Render = {
  canvas: null,
  ctx: null,
  margin: 26,
  scale: 1,

  COLOR_NEUTRAL: "#8a8f98",
  COLOR_ENL: "#1fb79b",
  COLOR_RES: "#3f8cf9",
  VIEW_LABEL: {
    enl: "Faction View ENL",
    res: "Faction View RES",
    public: "Public View",
    god: "God View",
  },

  init() {
    this.canvas = document.getElementById("map");
    this.ctx = this.canvas.getContext("2d");
    const w = D.header.config.map_width_cm;
    const h = D.header.config.map_height_cm;
    this.scale = Math.min(
      (this.canvas.width - 2 * this.margin) / w,
      (this.canvas.height - 2 * this.margin) / h
    );
  },

  toPx(x, y) {
    return [
      this.margin + x * this.scale,
      this.canvas.height - this.margin - y * this.scale,
    ];
  },

  portalColor(owner) {
    if (owner === 1) return this.COLOR_ENL;
    if (owner === 2) return this.COLOR_RES;
    return this.COLOR_NEUTRAL;
  },

  factionColor(tagOrKey) {
    if (tagOrKey === 0 || tagOrKey === "enl") return this.COLOR_ENL;
    if (tagOrKey === 1 || tagOrKey === "res") return this.COLOR_RES;
    return this.COLOR_NEUTRAL;
  },

  // Draw the fully materialized state of round `i` under `view`.
  draw(i, view) {
    const ctx = this.ctx;
    const state = D.stateAt(i);
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    // Fields first (background layer): semi-transparent triangles.
    ctx.globalAlpha = 0.18;
    for (const f of state.fields) {
      const pa = D.portalPos.get(f[0]);
      const pb = D.portalPos.get(f[1]);
      const pc = D.portalPos.get(f[2]);
      if (!pa || !pb || !pc) continue;
      ctx.fillStyle = this.factionColor(f[3]);
      ctx.beginPath();
      ctx.moveTo(...this.toPx(pa[0], pa[1]));
      ctx.lineTo(...this.toPx(pb[0], pb[1]));
      ctx.lineTo(...this.toPx(pc[0], pc[1]));
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Links: 2px faction lines.
    ctx.lineWidth = 2;
    for (const l of state.links) {
      const pa = D.portalPos.get(l[0]);
      const pb = D.portalPos.get(l[1]);
      if (!pa || !pb) continue;
      ctx.strokeStyle = this.factionColor(l[2]);
      ctx.beginPath();
      ctx.moveTo(...this.toPx(pa[0], pa[1]));
      ctx.lineTo(...this.toPx(pb[0], pb[1]));
      ctx.stroke();
    }

    // Portals: filled circles with an hp ring arc.
    const maxHp = D.header.config.portal_max_hp;
    for (const p of state.portals) {
      const pos = D.portalPos.get(p[0]);
      if (!pos) continue;
      const [px, py] = this.toPx(pos[0], pos[1]);
      const color = this.portalColor(p[1]);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.fill();
      if (p[1] !== 0 && p[2] > 0 && maxHp > 0) {
        // hp ring: fraction of the full circle, damaged portion dimmed.
        const frac = p[2] / maxHp;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py, 9, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = "rgba(140,150,160,0.35)";
        ctx.beginPath();
        ctx.arc(px, py, 9, -Math.PI / 2 + frac * Math.PI * 2, -Math.PI / 2 + Math.PI * 2);
        ctx.stroke();
      }
      // id label
      ctx.fillStyle = "#6f7a86";
      ctx.font = "9px ui-monospace, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.fillText(String(p[0]), px, py + 20);
    }

    // Agents: dots only where the active view allows (R-VIS).
    for (const a of Filter.visibleAgents(view, i)) {
      const [px, py] = this.toPx(a.x, a.y);
      ctx.fillStyle = this.factionColor(a.faction);
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#0b0e12";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = "#c9d3dd";
      ctx.font = "10px ui-monospace, Consolas, monospace";
      ctx.textAlign = "left";
      ctx.fillText(
        "a" + a.id + (i > 0 && a.supply >= 0 ? " (" + a.supply + ")" : ""),
        px + 7,
        py - 6
      );
    }

    // View label + round badge.
    ctx.fillStyle = "#8a97a8";
    ctx.font = "12px 'Segoe UI', system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(this.VIEW_LABEL[view] + "  ·  round " + i + " / " + D.roundCount, 12, 18);
    ctx.fillStyle = "#5d6772";
    ctx.font = "11px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(
      "ENL " + this.COLOR_ENL + "   RES " + this.COLOR_RES + "   Neutral #8a8f98",
      12,
      this.canvas.height - 10
    );
  },
};

// panels.js — the header block, the score curve, and the event log.
// Score display is presentation-only (rules/04: score2 is twice-squared
// cm; the exact integer is always shown, the km2 conversion below is an
// EXACT decimal shift, never a float).
const Panels = {
  kindNames: {
    1: "CAPTURE",
    2: "ATTACK",
    3: "NEUTRALIZE",
    4: "LINK+",
    5: "LINK-",
    6: "FIELD+",
    7: "FIELD-",
    8: "REINFORCE",
  },
  kindFilters: new Set([1, 2, 3, 4, 5, 6, 7, 8]),
  factionFilters: new Set([0, 1]), // 0=ENL 1=RES (both on by default)
  curveCanvas: null,
  curveCtx: null,

  init() {
    this.curveCanvas = document.getElementById("curve");
    this.curveCtx = this.curveCanvas.getContext("2d");
    this.renderHeader();
    this.buildEventFilters();
  },

  // ---- header block (always visible) ---------------------------------
  renderHeader() {
    const h = D.header;
    const meta = h.meta || {};
    const entrants =
      meta.entrant_a !== undefined
        ? meta.entrant_a + " vs " + meta.entrant_b +
          "  (" + (meta.tag || "?") + " j" + (meta.j !== undefined ? meta.j : "?") +
          ", map " + (meta.map_index !== undefined ? meta.map_index : "?") + ")"
        : "(no meta.json embedded)";
    const outcome = h.outcome;
    let outcomeLine;
    if (outcome.kind === "normal") {
      outcomeLine = "<b>" + outcome.result + "</b> after " + h.rounds_completed +
        " / " + h.total_rounds + " rounds";
    } else {
      outcomeLine = "<b>ABNORMAL END</b> outcome_tag=" + outcome.outcome_tag +
        " at last completed round " + outcome.last_round + " / " + h.total_rounds;
    }
    const finalScore = outcome.final_score2;
    const parts = [];
    parts.push('<div class="title">Ingress Arena Replay</div>');
    parts.push('<div class="grid">');
    parts.push("<span>" + this.esc(entrants) + "</span>");
    parts.push("<span>game_seed <b class='hash'>" + this.esc(h.game_seed) + "</b></span>");
    if (meta.map_seed !== undefined) {
      parts.push("<span>map_seed <b class='hash'>" + this.esc(meta.map_seed) + "</b></span>");
    }
    parts.push(
      "<span>portals <b>" + h.map.portals.length + "</b></span>" +
      "<span>rounds <b>" + h.rounds_completed + "/" + h.total_rounds + "</b></span>" +
      "<span>checkpoints <b>[" + h.checkpoints.join(",") + "]</b></span>" +
      "<span>versions <b>server " + h.versions.server + " · protocol " + h.versions.protocol +
      " · rng " + h.versions.rng + " · enc " + h.versions.state_encoding + "</b></span>"
    );
    parts.push("</div>");
    parts.push('<div class="grid">');
    parts.push("<span>outcome " + outcomeLine + "</span>");
    parts.push(
      "<span>final_score2 <b class='hash'>enl " + this.esc(finalScore[0]) +
      " · res " + this.esc(finalScore[1]) + "</b></span>"
    );
    parts.push(
      "<span>" + (outcome.kind === "normal" ? "final_hash" : "last_hash") +
      " <b class='hash'>" + this.esc(outcome.kind === "normal" ? outcome.final_hash : outcome.last_hash) + "</b></span>"
    );
    parts.push("</div>");
    if (outcome.kind === "abnormal") {
      parts.push(
        '<div class="banner abnormal">ABNORMAL TERMINATION — the match ended technically ' +
        "(outcome_tag " + outcome.outcome_tag + " = client forfeit for tags &gt;= 4, spawn forfeit = 3); " +
        "rounds after " + outcome.last_round + " were never played.</div>"
      );
    }
    if (h.dev) {
      parts.push(
        '<div class="banner dev">DEV EXPORT — BOTH factions\' private agents are embedded ' +
        "(header.dev=true): a debug/balance view. Player-facing exports embed one faction only.</div>"
      );
    } else {
      const embedded = h.factions_embedded.join(", ");
      parts.push(
        '<div class="banner rvis">R-VIS EXPORT — embedded agents: ' + embedded +
        ". The other faction\'s private data does not exist in this file; enemy knowledge " +
        "= public events only.</div>"
      );
    }
    document.getElementById("hdr").innerHTML = parts.join("");
  },

  // ---- exact score display (D91) ---------------------------------------
  // score2 -> cm2 by exact halving ("...5" when odd), then cm2 -> km2 by
  // an exact decimal shift of the digit string (floats never touch this).
  cm2FromScore2(s) {
    const n = BigInt(s);
    const whole = n / 2n;
    return whole.toString() + (n % 2n === 1n ? ".5" : "");
  },

  shiftRight(digits, places) {
    let padded = digits;
    while (padded.length <= places) padded = "0" + padded;
    let out = padded.slice(0, padded.length - places) + "." + padded.slice(padded.length - places);
    out = out.replace(/0+$/, "");
    if (out.endsWith(".")) out = out.slice(0, -1);
    return out;
  },

  km2FromScore2(s) {
    const n = BigInt(s);
    const odd = n % 2n === 1n;
    // cm2 = I(.5); as tenth-of-cm2 digits that is str(I) + "5", so km2
    // shifts the decimal point 11 places (10 for the cm2->km2 step plus
    // the extra tenth).
    const digits = (n / 2n).toString() + (odd ? "5" : "");
    return this.shiftRight(digits, odd ? 11 : 10);
  },

  // ---- score curve + readout -------------------------------------------
  updateCurve(i) {
    const ctx = this.curveCtx;
    const w = this.curveCanvas.width;
    const h = this.curveCanvas.height;
    ctx.clearRect(0, 0, w, h);
    const n = D.roundCount;

    // Max cumulative as a float ONLY for pixel scaling (display layer).
    let max = 1;
    for (const r of D.rounds) {
      max = Math.max(max, Number(r.score2[0]), Number(r.score2[1]));
    }
    const xOf = (r) => (n === 0 ? 0 : 30 + (r / n) * (w - 44));
    const yOf = (v) => h - 22 - (Number(v) / max) * (h - 38);

    // gridlines
    ctx.strokeStyle = "rgba(140,150,160,0.18)";
    ctx.lineWidth = 1;
    ctx.font = "10px ui-monospace, Consolas, monospace";
    ctx.fillStyle = "#77828f";
    ctx.textAlign = "right";
    for (const frac of [0, 0.5, 1]) {
      const y = h - 22 - frac * (h - 38);
      ctx.beginPath();
      ctx.moveTo(30, y);
      ctx.lineTo(w - 8, y);
      ctx.stroke();
      ctx.fillText(this.axisLabel(max * frac), 26, y + 3);
    }
    ctx.textAlign = "center";
    ctx.fillText("km2 (score2/2)", 60, 12);

    // dual cumulative polylines
    const series = [
      { color: Render.COLOR_ENL, idx: 0 },
      { color: Render.COLOR_RES, idx: 1 },
    ];
    for (const s of series) {
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(xOf(0), yOf("0"));
      for (let r = 1; r <= n; r += 1) {
        ctx.lineTo(xOf(r), yOf(D.rounds[r - 1].score2[s.idx]));
      }
      ctx.stroke();
    }

    // current-round marker
    if (i > 0) {
      const state = D.stateAt(i);
      const x = xOf(i);
      ctx.strokeStyle = "#e8b64c";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, 6);
      ctx.lineTo(x, h - 22);
      ctx.stroke();
      for (const s of series) {
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(x, yOf(state.score2[s.idx]), 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // readout with the exact integers
    const state = D.stateAt(i);
    const row = (label, cls, cum, delta) =>
      '<div class="row ' + cls + '"><span>' + label + "</span>" +
      '<span class="num">score2 ' + cum + " (&gt;" + delta + ") · " +
      this.cm2FromScore2(cum) + " cm2 = " + this.km2FromScore2(cum) + " km2</span></div>";
    document.getElementById("score-readout").innerHTML =
      row("ENL", "enl", state.score2[0], state.delta2[0]) +
      row("RES", "res", state.score2[1], state.delta2[1]);
  },

  axisLabel(v) {
    // Curve axis labels are pure display: km2 with 2 significant decimals.
    const km2 = Number(v) / 2 / 1e10;
    return km2.toPrecision(3);
  },

  // ---- event log --------------------------------------------------------
  buildEventFilters() {
    const box = document.getElementById("event-filters");
    const parts = [];
    for (let k = 1; k <= 8; k += 1) {
      parts.push(
        '<label><input type="checkbox" data-kind="' + k + '" checked> ' + this.kindNames[k] + "</label>"
      );
    }
    parts.push('<span class="group"></span>');
    parts.push('<label><input type="checkbox" data-faction="0" checked> ENL</label>');
    parts.push('<label><input type="checkbox" data-faction="1" checked> RES</label>');
    box.innerHTML = parts.join("");
    box.addEventListener("change", (event) => {
      const target = event.target;
      if (target.dataset.kind !== undefined) {
        const k = Number(target.dataset.kind);
        if (target.checked) this.kindFilters.add(k);
        else this.kindFilters.delete(k);
      }
      if (target.dataset.faction !== undefined) {
        const f = Number(target.dataset.faction);
        if (target.checked) this.factionFilters.add(f);
        else this.factionFilters.delete(f);
      }
      Controls.refresh();
    });
  },

  updateEvents(i) {
    const list = document.getElementById("events");
    const parts = [];
    for (let r = 1; r <= i; r += 1) {
      for (const ev of D.rounds[r - 1].events) {
        if (!Filter.eventVisible(ev, this.kindFilters, this.factionFilters)) continue;
        parts.push(this.eventLine(ev, r === i));
      }
    }
    list.innerHTML = parts.join("");
    if (list.lastElementChild) {
      list.lastElementChild.scrollIntoView({ block: "nearest" });
    }
  },

  eventLine(ev, current) {
    const factionClass = ev.f === undefined ? "both" : ev.f === 0 ? "enl" : "res";
    const factionText = ev.f === undefined ? "BOTH" : ev.f === 0 ? "ENL" : "RES";
    let detail = "";
    if (ev.p !== undefined) detail = "p" + ev.p;
    else if (ev.l !== undefined) detail = "l" + ev.l[0] + "-" + ev.l[1];
    else if (ev.t !== undefined) detail = "t" + ev.t[0] + "-" + ev.t[1] + "-" + ev.t[2];
    else if (ev.pos !== undefined) detail = "@" + ev.pos[0] + "," + ev.pos[1];
    let extra = "";
    if (ev.d !== undefined) extra += " d" + ev.d + " hp" + ev.h;
    if (ev.ar !== undefined && ev.ar > 0) extra += " ar" + ev.ar;
    if (ev.n !== undefined) extra += " n" + ev.n;
    const agent = ev.a !== undefined ? " a" + ev.a : "";
    return (
      '<li class="' + (current ? "current " : "") + factionClass + '">' +
      '<span class="dim">R' + String(ev.r).padStart(3, " ") + " #" + String(ev.s).padStart(5, " ") + "</span> " +
      this.kindNames[ev.k] + " " + detail + agent + extra +
      ' <span class="dim">' + factionText + "</span></li>"
    );
  },

  esc(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  },
};

// controls.js — playback state machine + input wiring. Jumping to any
// round is direct array indexing (O(1), D89): state {round, playing,
// speed, view}; space play/pause, arrows step, Home/End jump, +/- speed,
// V cycles the view.
const Controls = {
  state: { round: 0, playing: false, speed: 500, view: "god" },
  timer: null,

  init() {
    // Default view: God in a dev export, otherwise the one embedded
    // faction (D90) — the other faction label renders disabled below.
    if (!D.header.dev) {
      this.state.view = Filter.embedded[0] || "public";
    }
    this.wireButtons();
    this.wireSlider();
    this.wireViews();
    this.wireKeyboard();
    this.refresh();
  },

  wireButtons() {
    document.getElementById("btn-play").addEventListener("click", () => this.togglePlay());
    document.getElementById("btn-back").addEventListener("click", () => this.step(-1));
    document.getElementById("btn-fwd").addEventListener("click", () => this.step(1));
    document.getElementById("btn-home").addEventListener("click", () => this.jump(0));
    document.getElementById("btn-end").addEventListener("click", () => this.jump(D.roundCount));
    document.getElementById("speed").addEventListener("change", (event) => {
      this.setSpeed(Number(event.target.value));
    });
  },

  wireSlider() {
    const slider = document.getElementById("slider");
    slider.max = String(D.roundCount);
    slider.addEventListener("input", () => this.jump(Number(slider.value)));

    // Checkpoint ticks: display-only marks proving archive integrity
    // (the IARP checkpoints verified at export; seeking never needs them).
    const ticks = document.getElementById("ticks");
    const n = D.roundCount || 1;
    for (const round of D.header.checkpoints) {
      const tick = document.createElement("div");
      tick.className = "tick";
      tick.title = "IARP checkpoint after round " + round;
      tick.style.left = ((round / n) * 100).toFixed(2) + "%";
      ticks.appendChild(tick);
    }
  },

  wireViews() {
    const note = document.getElementById("view-note");
    document.querySelectorAll("#views button").forEach((button) => {
      const view = button.dataset.view;
      const usable = view === "public" || view === "god" || Filter.embedded.includes(view);
      if (!usable) {
        button.disabled = true;
        button.title =
          "not embedded in this export (R-VIS): this faction's private data does not exist in the file";
      }
      button.addEventListener("click", () => this.setView(view));
    });
    if (D.header.dev) {
      note.textContent = "dev export: all four views active (both factions embedded)";
    } else {
      note.textContent =
        "faction export: the other faction view is disabled — its private data is not in this file";
    }
  },

  wireKeyboard() {
    document.addEventListener("keydown", (event) => {
      if (event.target && /^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName)) return;
      switch (event.key) {
        case " ":
          event.preventDefault();
          this.togglePlay();
          break;
        case "ArrowLeft":
          event.preventDefault();
          this.step(-1);
          break;
        case "ArrowRight":
          event.preventDefault();
          this.step(1);
          break;
        case "Home":
          event.preventDefault();
          this.jump(0);
          break;
        case "End":
          event.preventDefault();
          this.jump(D.roundCount);
          break;
        case "+":
          this.shiftSpeed(1);
          break;
        case "-":
          this.shiftSpeed(-1);
          break;
        case "v":
        case "V":
          this.cycleView();
          break;
        default:
          break;
      }
    });
  },

  cycleView() {
    const order = ["enl", "res", "public", "god"].filter(
      (view) => view === "public" || view === "god" || Filter.embedded.includes(view)
    );
    const index = order.indexOf(this.state.view);
    this.setView(order[(index + 1) % order.length]);
  },

  shiftSpeed(direction) {
    const steps = [1000, 500, 250, 125];
    const index = steps.indexOf(this.state.speed);
    const next = Math.min(steps.length - 1, Math.max(0, index + direction));
    this.setSpeed(steps[next]);
    document.getElementById("speed").value = String(steps[next]);
  },

  setSpeed(ms) {
    this.state.speed = ms;
    if (this.state.playing) {
      this.stopTimer();
      this.startTimer();
    }
  },

  setView(view) {
    this.state.view = view;
    this.refresh();
  },

  togglePlay() {
    this.state.playing = !this.state.playing;
    if (this.state.playing) {
      if (this.state.round >= D.roundCount) this.jump(0);
      this.startTimer();
    } else {
      this.stopTimer();
    }
    this.refresh();
  },

  startTimer() {
    this.timer = window.setInterval(() => {
      if (this.state.round >= D.roundCount) {
        this.togglePlay();
        return;
      }
      this.jump(this.state.round + 1);
    }, this.state.speed);
  },

  stopTimer() {
    if (this.timer !== null) {
      window.clearInterval(this.timer);
      this.timer = null;
    }
  },

  step(delta) {
    this.jump(this.state.round + delta);
  },

  jump(round) {
    const clamped = Math.min(D.roundCount, Math.max(0, round));
    this.state.round = clamped;
    this.refresh();
  },

  refresh() {
    const { round, view, playing } = this.state;
    document.getElementById("slider").value = String(round);
    document.getElementById("round-readout").textContent =
      "round " + round + " / " + D.roundCount;
    document.getElementById("btn-play").textContent = playing ? "Pause" : "Play";
    document.querySelectorAll("#views button").forEach((button) => {
      button.classList.toggle("active", button.dataset.view === view);
    });
    Render.draw(round, view);
    Panels.updateCurve(round);
    Panels.updateEvents(round);
  },
};

// Boot (the exporter concatenates data/filter/render/panels/controls and
// then this file's sibling selftest.js runs after everything is live).
D.init();
Filter.init();
Render.init();
Panels.init();
Controls.init();

// selftest.js — ?selftest=1 re-runs the pure-data invariants of the
// embedded payload inside the page (works from file://). Human-triggered
// bonus mode (D93): no browser automation exists — the machine-tested
// split is documented in docs/viewer.md; this mode makes the same class
// of checks observable by hand in the real rendering environment.
(function runSelfTest() {
  const search = location.search || "";
  if (!/(^|[?&])selftest=1(&|$)/.test(search)) return;

  const checks = [];
  const add = (name, fn) => checks.push({ name, fn });
  const deepEq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  // 1. Integer fold: cumulative delta2 == score2 for EVERY round.
  add("delta2 fold == score2 for every round (BigInt)", () => {
    for (let i = 0; i < D.rounds.length; i += 1) {
      const round = D.rounds[i];
      const expected = [
        (i > 0 ? BigInt(D.rounds[i - 1].score2[0]) : 0n) + BigInt(round.delta2[0]),
        (i > 0 ? BigInt(D.rounds[i - 1].score2[1]) : 0n) + BigInt(round.delta2[1]),
      ];
      if (BigInt(round.score2[0]) !== expected[0] || BigInt(round.score2[1]) !== expected[1]) {
        return "round " + round.r + ": " + round.score2 + " != fold " + expected;
      }
    }
    return null;
  });

  // 2. Indexing: rounds[i].r == i+1 and len == header.rounds_completed.
  add("round indexing (r == i+1, len == rounds_completed)", () => {
    if (D.rounds.length !== D.header.rounds_completed) {
      return D.rounds.length + " rounds vs header " + D.header.rounds_completed;
    }
    for (let i = 0; i < D.rounds.length; i += 1) {
      if (D.rounds[i].r !== i + 1) return "rounds[" + i + "].r == " + D.rounds[i].r;
    }
    return null;
  });

  // 3. Last cumulative == outcome.final_score2.
  add("last cumulative score2 == outcome final_score2", () => {
    const last = D.rounds[D.rounds.length - 1];
    const finalScore = D.header.outcome.final_score2;
    if (last.score2[0] !== finalScore[0] || last.score2[1] !== finalScore[1]) {
      return last.score2 + " != " + finalScore;
    }
    return null;
  });

  // 4. View filters: Public has no agents anywhere; a faction view never
  //    contains enemy agents; God is a superset of each faction view.
  add("per-round view filters (public=none, faction=own only, god superset)", () => {
    for (let i = 1; i <= D.roundCount; i += 1) {
      if (Filter.visibleAgents("public", i).length !== 0) {
        return "public view shows agents at round " + i;
      }
      for (const key of ["enl", "res"]) {
        const agents = Filter.visibleAgents(key, i);
        if (agents.some((a) => a.faction !== key)) {
          return "faction view " + key + " leaks another faction at round " + i;
        }
        const god = Filter.visibleAgents("god", i);
        for (const a of agents) {
          if (!god.some((g) => g.faction === a.faction && g.id === a.id && g.x === a.x && g.y === a.y)) {
            return "god view lacks " + key + " agent " + a.id + " at round " + i;
          }
        }
      }
    }
    if (Filter.visibleAgents("public", 0).length !== 0) return "public view shows spawn dots";
    return null;
  });

  // 5. Event-filter predicate derivation.
  add("event filter predicate (kinds x factions, reinforcement both)", () => {
    const allKinds = new Set([1, 2, 3, 4, 5, 6, 7, 8]);
    // Synthetic predicate probes (hold even for a vacuous archive).
    if (!Filter.eventVisible({ k: 8 }, allKinds, new Set())) {
      return "synthetic reinforcement hidden by a faction filter";
    }
    if (Filter.eventVisible({ k: 1, f: 0 }, new Set(), new Set([0, 1]))) {
      return "synthetic kind shown with no kinds checked";
    }
    const events = D.eventsThrough(D.roundCount);
    for (const ev of events) {
      if (!Filter.eventVisible(ev, allKinds, new Set([0, 1]))) {
        return "all-filters-on hides event " + ev.s;
      }
      if (Filter.eventVisible(ev, new Set(), new Set([0, 1]))) {
        return "no-kinds shows event " + ev.s;
      }
      if (ev.k === 8) {
        if (ev.f !== undefined) return "reinforcement carries a faction tag";
        if (!Filter.eventVisible(ev, allKinds, new Set())) {
          return "both-faction reinforcement hidden by a faction filter";
        }
      } else if (ev.f === undefined) {
        return "kind " + ev.k + " event misses its faction tag";
      }
    }
    return null;
  });

  // 6. Jump determinism: the same round renders the same data twice.
  add("jump determinism (same round, same data)", () => {
    for (const i of [0, 1, Math.floor(D.roundCount / 2), D.roundCount]) {
      const a = D.stateAt(i);
      const b = D.stateAt(i);
      if (!deepEq(a, b)) return "stateAt(" + i + ") not stable";
      if (!deepEq(Filter.visibleAgents("god", i), Filter.visibleAgents("god", i))) {
        return "visibleAgents(" + i + ") not stable";
      }
    }
    return null;
  });

  // 7. Exact score display conversion (D91): cm2 is the exact half (one
  //    fractional digit at most) and km2 is that times 10^-10, verified as
  //    an exact integer relation (digits * 2 * 10^10 == n * 10^places).
  add("score2 display conversion exact (cm2 halving, km2 shift)", () => {
    for (const s of [
      "0",
      "1",
      "2",
      "3",
      "1000000000001",
      D.header.outcome.final_score2[0],
      D.header.outcome.final_score2[1],
    ]) {
      const n = BigInt(s);
      const cm2 = Panels.cm2FromScore2(s);
      const [int, frac = ""] = cm2.split(".");
      if (frac !== "" && frac !== "5") return "cm2 fraction of " + s + ": " + frac;
      if (BigInt(int) * 2n + (frac === "5" ? 1n : 0n) !== n) return "cm2 of " + s;
      const km2 = Panels.km2FromScore2(s);
      const kmDigits = km2.replace(".", "");
      const places = km2.includes(".") ? km2.length - km2.indexOf(".") - 1 : 0;
      if (BigInt(kmDigits) * 2n * 10n ** 10n !== n * 10n ** BigInt(places)) {
        return "km2 of " + s + " -> " + km2;
      }
    }
    return null;
  });

  const rows = [];
  let passed = 0;
  for (const check of checks) {
    let failure = null;
    try {
      failure = check.fn();
    } catch (error) {
      failure = String(error);
    }
    const ok = failure === null;
    if (ok) passed += 1;
    rows.push(
      "<tr><td class='" + (ok ? "pass" : "fail") + "'>" + (ok ? "PASS" : "FAIL") +
      "</td><td>" + check.name + "</td>" +
      (ok ? "" : "<td class='why'>" + String(failure).replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</td>") +
      "</tr>"
    );
  }
  const all = passed === checks.length;
  document.getElementById("selftest-result").innerHTML =
    "<div class='" + (all ? "pass" : "fail") + "'>SELFTEST " + passed + "/" + checks.length +
    (all ? " — PASS" : " — FAIL") + "</div><table>" + rows.join("") + "</table>";
  document.title += all ? " — SELFTEST PASS" : " — SELFTEST FAIL";
})();

</script>
